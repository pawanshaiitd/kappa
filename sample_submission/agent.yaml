name: swe_pipeline
agent_class: SequentialAgent
description: Locate, report, fix and verify one bug. A tool-less reporter step turns the locator's exploration into a fixed six-line report, so the fixer and verifier start from a clean context.
sub_agents:
  - config_path: locator.yaml
  - config_path: reporter.yaml
  - config_path: fixer.yaml
  - config_path: verifier.yaml
